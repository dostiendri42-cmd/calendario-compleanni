name: calendario_compleanni
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  warm_alarm: ^0.2.1
  permission_handler: ^13.0.2
  shared_preferences: ^2.3.0
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1" # Aggiunto per l'icona

flutter:
  uses-material-design: true
  assets:
    - assets/

# Configurazione per l'icona
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icona.jpeg"
