name: calendario_compleanni
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  warm_alarm: ^0.2.1
  permission_handler: ^13.0.2
  video_player: ^2.11.1 # Necessario per i video in slow motion

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Includendo la cartella intera, Flutter caricherà automaticamente 
  # tutte le immagini (jpeg, png), i video (mp4) e gli audio (mp3)
  assets:
    - assets/
